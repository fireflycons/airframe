{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "airframe.fullname" . }}
  labels:
    {{- include "airframe.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "gateway.parentRefs must name at least one Gateway" .Values.gateway.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path | quote }}
      backendRefs:
        - name: {{ include "airframe.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
