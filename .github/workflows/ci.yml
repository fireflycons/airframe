name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Lint once per GOOS so both platform variants of internal/cli are
      # checked (mirrors "make lint").
      - name: Lint (windows)
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: windows
        with:
          version: v2.12.2

      - name: Lint (linux)
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: linux
        with:
          version: v2.12.2

      # Mirrors "make test" without repeating the lint.
      - name: Test
        run: |
          go test -race ./...
          go test -count=20 ./internal/core/service
