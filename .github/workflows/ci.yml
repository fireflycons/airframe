name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Install only; the Makefile runs it once per GOOS so both platform
      # variants of internal/cli are linted.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          install-only: true

      # "make test" runs lint-windows and lint-linux, then the tests.
      - run: make test
