name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOFLAGS: -trimpath

jobs:
  version:
    name: Version not yet released
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Check VERSION.txt against existing tags
        run: |
          version=$(tr -d '[:space:]' < VERSION.txt)
          if [ -z "$version" ]; then
            echo "::error file=VERSION.txt::VERSION.txt is empty"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error file=VERSION.txt::Tag v$version already exists; bump VERSION.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The race detector needs cgo.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Test
        shell: bash
        run: |
          go test -race ./...
          go test -count=20 ./internal/core/service

  binaries:
    name: Build binaries
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build-windows-amd64 build-linux-amd64 build-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            bin/windows-amd64/airframe.exe
            bin/linux-amd64/airframe
            bin/darwin-arm64/airframe
          retention-days: 1
          if-no-files-found: error

  installer:
    name: Build Windows installer
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: nuget/setup-nuget@v2

      - uses: ./.github/actions/setup-nsis

      - name: Build installer
        run: make installer NUGET=nuget VERSION=${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            bin/windows-amd64/airframe-setup.exe
            bin/windows-amd64/Airframe_ScreenSaver.scr
          retention-days: 1
          if-no-files-found: error

  image:
    name: Build Docker image
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: fireflycons/airframe:${{ needs.version.outputs.version }}
          outputs: type=oci,dest=airframe-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-oci
          path: airframe-image.tar
          retention-days: 1
          if-no-files-found: error

  # Single required status check for branch protection: it fails if any job
  # above failed or was cancelled/skipped.
  pr-ok:
    name: PR checks passed
    if: always()
    needs: [version, test, binaries, installer, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
